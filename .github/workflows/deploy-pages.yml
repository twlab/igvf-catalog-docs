name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main, DSERV-1532-production-docs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Mintlify CLI
        run: npm install -g mintlify@latest

      - name: Build dev and main site trees
        run: |
          chmod +x scripts/build_static_site.sh
          mkdir -p _site
          scripts/build_static_site.sh dev _site/dev
          SKIP_GENERATED=1 scripts/build_static_site.sh main _site/main
          cp scripts/pages_root_index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
